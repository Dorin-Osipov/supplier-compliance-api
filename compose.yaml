services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: compliance
      POSTGRES_USER: compliance
      POSTGRES_PASSWORD: local-demo
    volumes:
      - supplier_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "compliance", "-d", "compliance"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build: .
    environment:
      DATABASE_URL: postgresql://compliance:local-demo@db:5432/compliance
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "-ec", "python -m storage && exec python -m uvicorn api:app --host 0.0.0.0 --port 8000"]
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/openapi.json', timeout=2).close()"]
      interval: 3s
      timeout: 4s
      retries: 20

volumes:
  supplier_data:
